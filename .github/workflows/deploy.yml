# Builds the app and publishes it to GitHub Pages.
#
# The base path comes from GITHUB_REPOSITORY at build time (see vite.config.ts),
# so renaming the repository needs no change here or anywhere else.
name: Deploy

on:
  push:
    branches: [main]
  # Lets a deploy be triggered by hand from the Actions tab.
  workflow_dispatch:

# One deployment at a time; a newer push supersedes a queued one but never
# interrupts a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Deploying something that does not typecheck or pass its tests would be
      # worse than not deploying at all.
      - run: npm test

      # The gated build is the paid one, and nothing else ever builds it — so
      # without this it would rot unnoticed, the way tools/ already has once.
      # Built only to prove it still compiles; the artifact is thrown away.
      #
      # Deliberately before the real build: both write to dist/, and the last
      # one to run is the one that gets published. Putting this after would
      # quietly deploy the gated app to a site that is meant to be free.
      - run: VITE_GATED=true npm run build

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
